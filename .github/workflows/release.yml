name: 🦅 Attach the Codex Pet to Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: 🏭 Install the Inno Setup compiler
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup -e --silent --accept-package-agreements --accept-source-agreements
      - name: 📦 Build and validate Codex pet packages
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - name: 🧪 Prove Codex pet installation and uninstall before attachment
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - name: 🎆 Attach installer and manual-import ZIP to existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload $env:RELEASE_TAG artifacts/Chudley-Codex-pet-installer.exe artifacts/Chudley-Codex-pet.zip
