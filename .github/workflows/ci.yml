name: Windows MVP CI

on:
  push:
    branches: [main, feat/windows-pet-mvp]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate supplied assets
        run: python tools/validate_assets.py
      - name: Build desktop app
        run: dotnet build src/Chudley.Desktop/Chudley.Desktop.csproj --configuration Release --warnaserror
      - name: Run deterministic core tests
        run: dotnet run --project tests/Chudley.Core.Tests/Chudley.Core.Tests.csproj --configuration Release
      - name: Publish Windows application
        run: dotnet publish src/Chudley.Desktop/Chudley.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output publish
      - name: Confirm published runtime frames
        shell: pwsh
        run: |
          if (!(Test-Path publish/assets/sprites/candidate/manifest.json)) { throw 'Published manifest is missing' }
          $frames = @(Get-ChildItem publish/assets/sprites/candidate/frames -Filter *.png)
          if ($frames.Count -ne 24) { throw "Expected 24 published frames, found $($frames.Count)" }
