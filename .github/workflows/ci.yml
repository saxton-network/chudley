name: 🇺🇸 Build, Test & Package Chudley

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🏭 Install the Inno Setup compiler
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup -e --silent --accept-package-agreements --accept-source-agreements
      - name: 📦 Build and validate Codex pet packages
        shell: pwsh
        run: ./scripts/build-installer.ps1
      - name: 🧪 Install and uninstall from Codex's Pets directory
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - name: 📦 Upload Codex pet packages
        uses: actions/upload-artifact@v4
        with:
          name: Chudley-Codex-pet-packages
          path: |
            artifacts/Chudley-Codex-pet.zip
            artifacts/Chudley-Codex-pet-installer.exe
          if-no-files-found: error
