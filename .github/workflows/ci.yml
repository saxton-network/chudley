name: Windows build and portable package

on:
  push:
    branches: [main, feat/working-chudley-replacement]
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build, test, validate assets, and package
        shell: pwsh
        run: ./scripts/publish-windows.ps1
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: Chudley-win-x64-portable
          path: artifacts/Chudley-win-x64-portable.zip
          if-no-files-found: error
